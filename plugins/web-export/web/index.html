<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umbra</title>
<link rel="stylesheet" href="umbra-page.css">
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>

<!-- The game's HUD (filled from core::Hud every frame it changes) -->
<div id="hud">
  <div id="status"></div>
  <div id="warnings"></div>
  <div id="stats"></div>
  <div id="message"></div>
  <div id="prompt"></div>
  <div id="dim"></div>
  <div id="menu"><h2 id="menu-title"></h2><p id="menu-text"></p><ol id="menu-items"></ol><p id="menu-hint"></p></div>
</div>

<!-- Before the game runs: loading, "click to play", or why it can't run -->
<div id="start">
  <h1>Umbra</h1>
  <p id="start-text">Loading...</p>
  <button id="play" hidden>Click to play</button>
  <p class="small">Keys: WASD move, mouse look, E use, Tab turn/real-time combat, Esc menu. Chrome or Edge with WebGPU.</p>
</div>

<!-- Saves and offline install -->
<div id="bar">
  <span id="offline">Offline: checking...</span>
  <button id="export" title="Download your saved games as a file">Export saves</button>
  <label class="button" title="Load saved games from an exported file">Import saves<input id="import" type="file" accept=".json" hidden></label>
</div>
<div id="notice" hidden></div>

<script src="umbra-page.js"></script>
</body>
</html>
